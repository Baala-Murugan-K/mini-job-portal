services:
  # 1. Python Resume Matcher Microservice
  - type: web
    name: jobportal-python
    env: python
    plan: free
    region: oregon
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5001

  # 2. PHP File Ingestion Service (Docker on Render)
  - type: web
    name: jobportal-php
    env: docker
    plan: free
    region: oregon
    rootDir: php-service
    dockerfilePath: php-service/Dockerfile
    envVars:
      - key: PORT
        value: 80

  # 3. Node.js + Express Core API
  - type: web
    name: jobportal-server
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        value: mongodb+srv://baalamurugank25_db_user:9pyuva0wtg0ZYm3O@cluster0.r0kjo3j.mongodb.net/mini_job_portal?retryWrites=true&w=majority
      - key: PYTHON_SERVICE_URL
        value: https://jobportal-python.onrender.com/match

  # 4. React SPA Client (Static Site)
  - type: web
    name: jobportal-client
    env: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_EXPRESS_URL
        value: https://jobportal-server.onrender.com
      - key: VITE_PHP_URL
        value: https://jobportal-php.onrender.com
