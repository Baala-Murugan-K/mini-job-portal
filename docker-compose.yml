version: '3.8'

services:
  # 1. PHP Upload & Feedback Service
  php-service:
    build:
      context: ./php-service
      dockerfile: Dockerfile
    container_name: jobportal-php
    ports:
      - "8000:80"
    volumes:
      - shared-uploads:/var/www/html/uploads
    restart: unless-stopped

  # 2. Python Resume Matcher Service
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: jobportal-python
    ports:
      - "5001:5001"
    restart: unless-stopped

  # 3. Node.js + Express Core API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jobportal-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://baalamurugank25_db_user:9pyuva0wtg0ZYm3O@cluster0.r0kjo3j.mongodb.net/mini_job_portal?retryWrites=true&w=majority}
      - PYTHON_SERVICE_URL=http://python-service:5001/match
    depends_on:
      - python-service
    volumes:
      - shared-uploads:/app/uploads
    restart: unless-stopped

  # 4. React Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jobportal-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  shared-uploads:
    driver: local
